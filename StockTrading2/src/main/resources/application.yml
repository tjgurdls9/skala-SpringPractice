spring:
  application:
    name: skala3-stock-trading-day4

  datasource:
    url: jdbc:h2:mem:stockdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.skala.stock.entity
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

# ── Actuator ────────────────────────────────────────────────
# 학습용이라 대부분의 엔드포인트를 열어둔다. 운영에서는 health/info/metrics 정도만 노출하고
# 나머지는 인증 뒤에 두어야 한다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, beans, mappings, loggers, httpexchanges, tradeaudit
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: SKALA 주식 거래 시스템
    description: JPA + MyBatis(SQL Mapper) 기반 주식 매매/분석 API
    version: 0.0.1-SNAPSHOT
  build:
    java: 21
    framework: Spring Boot 3.2.0

logging:
  level:
    com.skala.stock: DEBUG
    org.springframework.web: INFO
