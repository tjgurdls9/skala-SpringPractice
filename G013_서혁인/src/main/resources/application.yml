spring:
  application:
    name: team-match-platform         # 애플리케이션 이름 설정 (구분용)

  profiles:
    active: local                     # 기본 프로필: local (로컬 디스크 파일 저장소 사용)

  datasource:
    # DB_CLOSE_DELAY=-1: 커넥션 풀이 유휴 커넥션을 회수해 마지막 커넥션이 잠깐 끊기더라도
    # JVM이 떠 있는 동안은 인메모리 DB(및 데이터)가 사라지지 않게 유지한다 (★ 중요, 실사용 중 발견).
    url: jdbc:h2:mem:teammatchdb;DB_CLOSE_DELAY=-1            # H2 인메모리(In-Memory) DB 사용 설정
    driver-class-name: org.h2.Driver          # H2 데이터베이스 드라이버 클래스
    username: sa                                          # DB 접속 사용자명
    password:                                               # DB 접속 비밀번호 (빈 값)

  h2:
    console:
      enabled: true                                       # H2 웹 콘솔 기능 활성화 (브라우저 접속 허용)
      path: /h2-console                               # H2 웹 콘솔 접속 URL 경로 (http://localhost:8080/h2-console)

  jpa:
    # JPA가 테이블을 모두 생성(DDL)한 후 data.sql 스크립트가 실행되도록 순서를 뒤로 미룸 (★ 중요)
    defer-datasource-initialization: true
    hibernate:
      # 서버 가동 시 기존 테이블을 삭제(drop)하고 새로 생성(create), 서버 종료 시 테이블 삭제(drop)
      ddl-auto: create-drop
    show-sql: true                                      # 실행되는 SQL 쿼리를 콘솔 로그에 출력
    properties:
      hibernate:
        format_sql: true                               # 콘솔에 출력되는 SQL 쿼리를 가독성 좋게 줄바꿈 정렬
        dialect: org.hibernate.dialect.H2Dialect                # H2 DB 전용 SQL 방언(Dialect) 사용 설정

  sql:
    init:
      mode: always                                    # 서버 가동 시 초기화 SQL 스크립트를 항상 실행
      # 실행할 초기 데이터 스크립트 위치 지정 (src/main/resources/data.sql)
      data-locations: classpath:data.sql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      # 정적 리소스(index.html/app.js/style.css)를 브라우저가 오래 캐싱해서 수정 사항이
      # 반영 안 되는 문제(실사용 중 발견 — 배포해도 그전 화면이 계속 보임)를 막기 위해
      # 캐시를 끈다. 트래픽이 큰 서비스라면 버전 쿼리스트링 방식이 낫지만, 이 실습 규모에서는
      # 캐시를 아예 끄는 쪽이 더 단순하고 확실하다.
      cache:
        cachecontrol:
          no-store: true

# 마이바티스(MyBatis) 설정 (JPA와 혼용 사용 시)
mybatis:
  # XML 매퍼 파일들의 위치 지정 (src/main/resources/mapper/ 하위 모든 xml)
  mapper-locations: classpath:mapper/**/*.xml
  # 매퍼 XML에서 사용할 엔티티 클래스들의 패키지 경로 (별칭 자동 지정)
  type-aliases-package: com.skala.teammatch.dto
  configuration:
    # DB 컬럼명(snake_case)을 Java 필드명(camelCase)으로 자동 매핑
    map-underscore-to-camel-case: true

# Swagger / OpenAPI 문서화 설정
springdoc:
  api-docs:
    path: /api-docs                                      # OpenAPI 규격 JSON 데이터 제공 경로
  swagger-ui:
    path: /swagger-ui.html                          # Swagger UI 웹 문서 화면 접속 경로

# 웹 서버 설정
server:
  port: 8080                                               # 애플리케이션 포트 번호 설정

# 로깅(Logging) 레벨 설정
logging:
  level:
    com.skala.teammatch: DEBUG                     # 프로젝트 커스텀 패키지는 상세 로그(DEBUG) 출력
    org.springframework.web: INFO        # 스프링 웹 프레임워크 기본 로그는 일반 로그(INFO) 출력

# 애플리케이션 커스텀 설정 (Profile 별로 local/prod 파일에서 override)
app:
  storage:
    type: local
    local:
      directory: ./uploads/portfolio
    s3:
      bucket: team-match-portfolio-bucket
      region: ap-northeast-2

# Actuator 엔드포인트 노출 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
