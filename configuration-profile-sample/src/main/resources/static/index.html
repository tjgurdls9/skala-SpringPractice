<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Config Sample</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            max-width: 500px;
            width: 90%;
            border: 1px solid #e2e8f0;
        }
        .status-badge {
            display: inline-block;
            background-color: #dcfce7;
            color: #166534;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }
        p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .info-group {
            background-color: #f1f5f9;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            padding: 0.4rem 0;
        }
        .info-row:not(:last-child) {
            border-bottom: 1px dashed #cbd5e1;
        }
        .info-label {
            color: #64748b;
        }
        .info-value {
            font-weight: 600;
            color: #334155;
        }
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #2563eb;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="status-badge">● Server Running</span>
        <h1>Configuration Sample</h1>

        <div class="info-group">
            <div class="info-row">
                <span class="info-label">Context Path</span>
                <span class="info-value">/api</span>
            </div>
            <div class="info-row">
                <span class="info-label">Port</span>
                <span class="info-value">8080</span>
            </div>
            <div class="info-row">
                <span class="info-label">Active Profile</span>
                <span class="info-value">local</span>
            </div>
        </div>

        <a href="/api/swagger-ui/index.html" class="btn">Swagger UI API 문서 보기</a>
    </div>

</body>
</html>
